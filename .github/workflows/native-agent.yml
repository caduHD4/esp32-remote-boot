name: Native agent
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            executable: remote-boot-agent
          - os: windows-2022
            rid: win-x64
            executable: remote-boot-agent.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish NativeAOT
        run: dotnet publish agent/native/RemoteBoot.Agent.csproj -c Release -r ${{ matrix.rid }} -o build/agent/${{ matrix.rid }}
      - name: Test native binary (no real power actions)
        shell: pwsh
        run: |
          & "./build/agent/${{ matrix.rid }}/${{ matrix.executable }}" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          Get-FileHash "./build/agent/${{ matrix.rid }}/${{ matrix.executable }}" -Algorithm SHA256 | Format-List | Out-File "./build/agent/${{ matrix.rid }}/SHA256.txt"
      - name: Linux installer fixtures
        if: runner.os == 'Linux'
        run: python3 agent/native/tests/installer-fixtures.py
      - name: Windows installer fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./agent/native/tests/installer-fixtures.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.rid }}
          path: |
            build/agent/${{ matrix.rid }}/${{ matrix.executable }}
            build/agent/${{ matrix.rid }}/SHA256.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: build/native-artifacts
      - name: Package agents and installers
        run: python3 scripts/package_agents.py
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/remote-boot-agent-*.zip
            dist/agent-SHA256SUMS
